http {
    #log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
    #                  '$status $body_bytes_sent "$http_referer" '
    #                  '"$http_user_agent" "$http_x_forwarded_for" $host' '$server_port' '$scheme';

    log_format  main  '$remote_addr - $remote_user [$time_local] |$scheme://$host$request_uri|$request_method|$request_uri|$host|$status|$body_bytes_sent|$http_referer|$http_user_agent|$http_x_forwarded_for|$host|$server_port|$scheme|$http_cdn_custom_header|$request_Length|$request_body_file|$request_body';
    access_log  /var/log/nginx/access.log  main;
    error_log /var/log/nginx/error.log debug;
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 4096;
    autoindex off;
    autoindex_exact_size off; 
    autoindex_localtime off;
    ssl_protocols TLSv1.2 TLSv1.3; 
    include             /etc/nginx/mime.types;
    max_ranges                    20;
    #max_ranges                    2;
    default_type        application/octet-stream;

