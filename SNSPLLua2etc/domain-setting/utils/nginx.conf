            add_header Content-Disposition "filename=test.exe";
            root   /etc/nginx/html;
        }
         location ~* \.(abc)$
        {
            more_set_headers "Content-Type:text/html";
            root   /etc/nginx/html;
        }
#       location ~* \.(ico)$
        location /video
           {
            #expires      2h;
            root   /etc/nginx/html;
            proxy_ignore_headers X-Accel-Expires Expires Cache-Control Set-Cookie;
            #proxy_cache off;
            proxy_redirect off;
            ##content_by_lua_file /etc/nginx/lua/md5.lua;
            proxy_set_header X-Real-IP $remote_addr;
          #  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 180;
            proxy_send_timeout 180;
            proxy_read_timeout 180;
            proxy_buffer_size 128k;
            proxy_buffers 4 128k;
            proxy_busy_buffers_size 128k;
            proxy_temp_file_write_size 128k;
            #add_header Cache-Control 1800;
            autoindex on;  # 开启目录文件列表
            autoindex_exact_size on;  # 显示出文件的确切大小，单位是bytes
            autoindex_localtime on;  # 显示的文件时间为文件的服务器时间
            charset utf-8,gbk;  # 避免中文乱码
            proxy_cache_key   $server_addr$uri$is_args$args;
            #add_header Cache-Control no-cache;
           }
        location ~index\.(html)$
           {
            root   /etc/nginx/html;
            ##content_by_lua_file /etc/nginx/lua/md5.lua;
            add_header Cache-Control max-age=30;
            #add_header Pragma no-cache; 
            #add_header Expires 0;
           } 
        location ~* \.(jsp|jsx|axjs)$
           {
            root   /etc/nginx/html;
            #header_filter_by_lua_file /etc/nginx/lua/testp.lua;
            more_set_headers  "Access-Control-Allow-Origin:http://test.com";
             #content_by_lua_block {
             #    ngx.log(ngx.ERR,"gyj---request beginning");
             #    ngx.sleep(60);
             #    ngx.log(ngx.ERR,"gyj---request ending");
            #}
            #content_by_lua_file /etc/nginx/lua/md5.lua;
            #add_header Cache-Control no-cache;
            add_header Cache-Control max-age=30;
            #more_set_headers "Content-MD5:xhdM25CSC8hOO2z0DEOmBg==";
            more_set_headers "Content-MD5:xhdM25CSC8hOO2z0";
            more_set_headers "x-cos-hash-crc64ecma:crc64SC8hOO2z0";
            more_set_headers "Content-sha256: e2e35f97f59b1ea3da098558025e1554b711f0258149b70f1e5e10f701773f8f";
           }
        location ~* \.(jsp)$ {
            #ngx前端放的静态文件
            #expires      0;
            root   /etc/nginx/html;
            #index  index.html index.htm;
            #add_header Cache-Control no-cache;
            add_header Ali-Swift-Global-Savetime 1626695557;
            limit_rate 10m;
            limit_rate_after 0m;
            proxy_connect_timeout 1200;
            proxy_send_timeout 1200s;
            proxy_read_timeout 1200s;
            proxy_redirect off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            add_header x-via $server_addr;
            autoindex on;
        }
        #location / {
         #   root   /etc/nginx/html;
            #add_header Cache-Control no-cache;
            #          
        #}
        location = /api/v1/jsbGetScoreInfo {
            access_by_lua_block {
                --ngx.log(ngx.ERR,"gyj---request POST /api/v1/");
            }
            root   /etc/nginx/html;
        } 

        # Load configuration files for the default server block.
        include /etc/nginx/default.d/*.conf;

        error_page 404 /404.html;
        location = /404.html {
            #more_set_headers "Cache-Control: max-age=30";
            #add_header Cache-Control "public, max-age=30";
            add_header Access-Control-Allow-Headers X-Data-Type,X-Auth-Token;
            return 404;

        }


        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
        }
        
        #add_header x-via $server_addr;
        #brotli on;
        #brotli_comp_level 6;
        #brotli_buffers 16 8k;
        #brotli_min_length 20;
        #brotli_types image/jpeg text/plain text/css application/json application/x-javascript text/xml application/xml application/xml+rss text/javascript application/javascript image/svg+xml;
 

