[2025-02-14 14:36:20][PID:12348] job_start
server {
  listen *:80;
  listen [::]:80;
  listen *:443 ssl;
  listen [::]:443 ssl;
  server_name           test.migucloud.com;
  set $cpid 80007940;
  set_by_lua $uri_args 'return ngx.var.uri';
  ssl_certificate		/etc/nginx/ssl/migu/migucloud.com.crt;
  ssl_certificate_key		/etc/nginx/ssl/migu/migucloud.com.key;
  header_filter_by_lua_file /etc/nginx/lua/logmerge.lua;

  set $cacha_hit_status '-';
  set $cache_addr '-';
  set $merge_info '-|-|-|-|-|-|-|-|-|-|-|-|-|-|-|-|-|-|-|-|-|-|-|1';
  set $reserved '-|-|-|-|-|-|-|-|-|-|-|-|-|-|-|-|-|-|-|-';
  set $user_agent '-';
  set $up_status "-";

  index  index.html index.htm index.php;
  access_log /var/log/nginx/static-website-test.access.log hycdnex if=$test_log_on;
  access_log /var/log/nginx/static-website.access.log hycdnex if=$test_log_off;
  error_log      /var/log/nginx/static-website.error.log;

  location / {
    proxy_pass            http://cacheserver_args;
    proxy_read_timeout 60;
    proxy_connect_timeout 5; 
    proxy_set_header      Hy-Request-ID $hy_request_id; 
    proxy_http_version    1.1;
    proxy_set_header      Host  $host:$server_port;
    proxy_set_header      X-Real-IP  $remote_addr;
    proxy_set_header      X-Forwarded-For  $proxy_add_x_forwarded_for;
    proxy_set_header      Proxy '';
    proxy_send_timeout    300;
    more_set_headers     "Access-Control-Allow-Origin: *";
    more_set_headers     "Access-Control-Allow-Methods: GET, POST, OPTIONS";
    more_set_headers     "Access-Control-Allow-Headers: X-Requested-With, Content-Type";
  }

  send_timeout 300s;
}