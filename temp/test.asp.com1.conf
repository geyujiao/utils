server {
  listen 10.1.5.204:80;
  server_name          test.aspX.com;
  index  index.html index.htm index.php;
  location / {
         root /usr/share/nginx/origin;
  }
  more_set_headers "Debug:X";
}

server {
  listen 10.1.5.204:80;
  #include /etc/nginx/vip_a.com.conf;
  server_name          test.asp.com; 
  index  index.html index.htm index.php;
  set $loghost "xx";
